<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кибер-Змейка и Волки</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #ffffff;
            color: #0f051d;
            touch-action: manipulation;
            user-select: none;
        }
        .cyber-font {
            font-family: 'Orbitron', sans-serif;

        canvas {
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.2);
            border-radius: 12px;
            background-color: #f8fafc;

        .cyber-border {
            border: 2px solid #a855f7;
            position: relative;
        }
        .cyber-border::before {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            border: 1px solid rgba(236, 72, 153, 0.3);
            border-radius: 14px;
            pointer-events: none;

        @keyframes firework {
            0% { transform: scale(0.1); opacity: 1; }

<body class="min-h-screen flex flex-col items-center justify-between p-1 sm:p-2 overflow-x-hidden">

        <!-- Кнопка 3 точки для настроек -->

    <!-- Модальное окно настроек -->
    <div id="settingsModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4" onclick="if(event.target === this) toggleSettingsModal()">
        <div class="bg-white border-2 border-purple-400 rounded-2xl p-4 w-72 shadow-2xl cyber-font">

            <button onclick="toggleSettingsModal()" class="mt-4 w-full bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold py-1.5 rounded-lg text-xs shadow-md">

    <main class="flex flex-col items-center w-full max-w-sm flex-grow justify-start my-0.5 space-y-1.5">

                <div class="w-10 h-10 mb-2 rounded-full bg-pink-50 border border-pink-300 flex items-center justify-center text-pink-600 text-lg shadow animate-pulse">🐺</div>
                <h2 class="cyber-font text-sm sm:text-base text-pink-600 font-bold tracking-wider mb-1">КИБЕР-ЗМЕЙКА И ВОЛКИ</h2>

                <div class="cyber-font bg-gradient-to-r from-pink-500 to-cyan-500 text-white font-extrabold px-5 py-1.5 rounded-lg shadow text-[11px] tracking-widest">
                    СТАРТ

            <!-- Экран Game Over -->
            <div id="gameOverOverlay" class="absolute inset-0 bg-white/95 backdrop-blur-md hidden flex flex-col items-center justify-center rounded-xl p-4 text-center cursor-pointer shadow-lg" onclick="startGame()">
                <h2 id="gameOverTitle" class="cyber-font text-lg text-pink-600 mb-1 font-bold">СТОЛКНОВЕНИЕ</h2>
                <p id="finalScoreText" class="text-cyan-700 text-xs mb-3">Результат</p>
                <div class="cyber-font bg-gradient-to-r from-pink-500 to-cyan-500 text-white font-extrabold px-5 py-2 rounded-lg shadow text-xs tracking-widest">
                    ИГРАТЬ СНОВА
                </div>
            </div>

            <!-- Экран Победы -->
            <div id="winOverlay" class="absolute inset-0 bg-gradient-to-b from-purple-900/95 to-pink-900/95 backdrop-blur-md hidden flex flex-col items-center justify-center rounded-xl p-4 text-center cursor-pointer shadow-2xl text-white overflow-hidden" onclick="startGame()">
                <div id="fireworksContainer" class="absolute inset-0 pointer-events-none"></div>
                <div class="text-3xl mb-1 animate-bounce">🏆</div>
                <h2 class="cyber-font text-xl sm:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-pink-300 to-cyan-300 mb-1 drop-shadow">

                </h2>
                <p class="cyber-font text-xs sm:text-sm text-yellow-200 font-bold mb-3 drop-shadow">

                <div class="cyber-font bg-gradient-to-r from-yellow-400 to-pink-500 text-white font-extrabold px-6 py-2 rounded-xl shadow text-xs tracking-widest">

                </div>
            </div>
        </div>

        <!-- Кнопки управления (появляются только при старте игры) -->
        <div id="controlsContainer" class="grid grid-cols-3 gap-1.5 mt-1 w-44 max-w-full hidden">
            <div></div>
            <button id="btn-up" class="bg-purple-100 border border-purple-300 p-2.5 rounded-xl flex items-center justify-center text-cyan-700 text-sm font-bold shadow select-none transition-all">⬆️</button>
            <div></div>
            <button id="btn-left" class="bg-purple-100 border border-purple-300 p-2.5 rounded-xl flex items-center justify-center text-cyan-700 text-sm font-bold shadow select-none transition-all">⬅️</button>
            <button id="btn-down" class="bg-purple-100 border border-purple-300 p-2.5 rounded-xl flex items-center justify-center text-cyan-700 text-sm font-bold shadow select-none transition-all">⬇️</button>
            <button id="btn-right" class="bg-purple-100 border border-purple-300 p-2.5 rounded-xl flex items-center justify-center text-cyan-700 text-sm font-bold shadow select-none transition-all">➡️</button>
        </div>
    </main>

    <script>
        let audioCtx = null;
        let vibrationEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleSettingsModal() {
            const modal = document.getElementById("settingsModal");
            modal.classList.toggle("hidden");
        }

        function triggerVibration(pattern = 35) {
            if (!vibrationEnabled) return;
            if (navigator.vibrate) {
                try {
                    navigator.vibrate(pattern);
                } catch (e) {}
            }
        }

        function changeVibration(val) {
            vibrationEnabled = (val === 'on');
        }

        // Звук движения змейки (мягкий шуршащий тон)
        function playSlitherSound() {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(110, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.05);

                gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) {}
        }

        // Динамичная музыка погони
        function playChaseSound(intensity) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                let freq = 65 + intensity * 45;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.3, audioCtx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) {}
        }

        // Звук при поимке волчонка
        function playEatSound() {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.15);

                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) {}
        }

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const tileSize = 20;
        const tileCount = canvas.width / tileSize;

        let snake = [];
        let goats = [];
        let dx = 1;
        let dy = 0;
        let collectedNames = [];
        let gameInterval = null;
        let gameSpeed = 130;
        let isGameRunning = false;
        let changingDirection = false;
        let tickCounter = 0;
        let currentControlType = "buttons";

        // 15 волчат, имя "Ибряшка" вместо "Аюб", имя "Яса1"
        const allNames = ["Ильяс", "Хизир", "Шамхан", "Сулейман", "Шамиль", "Юнус", "Юсуф", "Яхья", "Ибряшка", "Жим Шамиль", "Хасайн", "Яса1", "Муса", "Ахмад", "Закри"];
        
        // Логика Закри с таймерами по 2 минуты (120 секунд)
        let zakriPhase = 0; // 0: escaping, 1: avoidance timer (2 min), 2: approaching timer (2 min), 3: vulnerable capture timer (2 min)
        let zakriTimer = 0;
        const TWO_MINUTES_SECONDS = 120;

        function getTicksFor2Minutes() {
            let sSpeed = Math.floor(gameSpeed * 0.9);
            return Math.floor((TWO_MINUTES_SECONDS * 1000) / sSpeed);
        }

        function initSlots() {
            const container = document.getElementById("slotsContainer");
            container.innerHTML = "";
            allNames.forEach((name, index) => {
                const slot = document.createElement("div");
                slot.id = `slot-${index}`;
                slot.className = "bg-purple-50 border border-purple-200 rounded p-0.5 text-center text-[8px] text-gray-500 font-semibold transition-all shadow-sm truncate";
                slot.innerText = name;
                container.appendChild(slot);
            });
        }
        initSlots();

        function changeSpeed(val) {
            gameSpeed = parseInt(val);
            if (isGameRunning) {
                restartGameLoop();
            }
        }

        function changeControlType(type) {
            currentControlType = type;
        }

        function restartGameLoop() {
            if (gameInterval) clearInterval(gameInterval);
            let snakeSpeed = Math.floor(gameSpeed * 0.9); // Змейка на 10% быстрее волков
            gameInterval = setInterval(gameLoop, snakeSpeed);
        }

        function startGame() {
            initAudio();
            document.getElementById("startOverlay").classList.add("hidden");
            document.getElementById("gameOverOverlay").classList.add("hidden");
            document.getElementById("winOverlay").classList.add("hidden");
            document.getElementById("controlsContainer").classList.remove("hidden"); // Показываем кнопки управления
            
            snake = [
                { x: 9, y: 10 },
                { x: 8, y: 10 },
                { x: 7, y: 10 }
            ];
            collectedNames = [];
            dx = 1;
            dy = 0;
            tickCounter = 0;
            zakriPhase = 0;
            zakriTimer = 0;
            updateUI();
            spawnAllGoats();
            
            restartGameLoop();
            isGameRunning = true;
        }

        function spawnAllGoats() {
            goats = [];
            allNames.forEach(name => {
                const isZakri = (name === "Закри");
                let goatObj = createRandomGoat(name, isZakri);
                goats.push(goatObj);
            });
        }

        function createRandomGoat(name, isZakri) {
            let pos;
            let overlapping;
            do {
                overlapping = false;
                pos = {
                    x: Math.floor(Math.random() * (tileCount - 2)) + 1,
                    y: Math.floor(Math.random() * (tileCount - 2)) + 1
                };
                snake.forEach(part => {
                    if (part.x === pos.x && part.y === pos.y) overlapping = true;
                });
                goats.forEach(g => {
                    if (g.x === pos.x && g.y === pos.y) overlapping = true;
                });
            } while (overlapping);

            return {
                x: pos.x,
                y: pos.y,
                name: name,
                isZakri: isZakri,
                collected: false
            };
        }

        function gameLoop() {
            changingDirection = false;
            tickCounter++;

            playSlitherSound();

            const remainingNonZakri = goats.filter(g => !g.isZakri && !g.collected).length;
            const zakriObj = goats.find(g => g.isZakri);

            if (zakriObj && !zakriObj.collected) {
                const head = snake[0];
                const distToZakri = Math.abs(head.x - zakriObj.x) + Math.abs(head.y - zakriObj.y);
                const limitTicks = getTicksFor2Minutes();

                if (remainingNonZakri > 0) {
                    moveGoatAway(zakriObj);
                    zakriPhase = 0;
                    zakriTimer = 0;
                } else {
                    if (zakriPhase === 0) {
                        moveGoatAway(zakriObj);
                        if (distToZakri < 4) {
                            zakriTimer = 0;
                        } else {
                            zakriTimer++;
                        }
                        if (zakriTimer >= limitTicks) {
                            zakriPhase = 1;
                            zakriTimer = 0;
                        }
                    } else if (zakriPhase === 1) {
                        moveGoatTowards(zakriObj);
                        zakriTimer++;
                        playChaseSound(3);

                        if (distToZakri < 2) {
                            zakriPhase = 0;
                            zakriTimer = 0;
                        } else if (zakriTimer >= limitTicks) {
                            zakriPhase = 2;
                            zakriTimer = 0;
                        }
                    } else if (zakriPhase === 2) {
                        if (tickCounter % 2 === 0) {
                            moveGoatAway(zakriObj, true);
                        }
                        zakriTimer++;
                        playChaseSound(5);

                        if (zakriTimer >= limitTicks) {
                            zakriPhase = 0;
                            zakriTimer = 0;
                        }
                    }
                }
            }

            // Движение остальных волков (сниженная активность, не проходят сквозь друг друга и змейку, отходят на 1 клетку от границ)
            goats.forEach(goat => {
                if (!goat.collected && !goat.isZakri) {
                    const dist = Math.abs(snake[0].x - goat.x) + Math.abs(snake[0].y - goat.y);
                    if (dist <= 4 && tickCounter % 8 === 0) {
                        moveGoatAway(goat);
                    }
                }
            });

            clearCanvas();
            drawGrid();
            moveSnake();
            drawGoats();
            drawSnake();
        }

        function isCellBlocked(nx, ny, currentGoat) {
            if (nx < 1 || nx >= tileCount - 1 || ny < 1 || ny >= tileCount - 1) return true;
            
            let onSnake = false;
            snake.forEach(part => {
                if (part.x === nx && part.y === ny) onSnake = true;
            });
            if (onSnake) return true;

            let onOtherGoat = false;
            goats.forEach(g => {
                if (g !== currentGoat && !g.collected && g.x === nx && g.y === ny) onOtherGoat = true;
            });
            if (onOtherGoat) return true;

            return false;
        }

        function moveGoatAway(goat, isSlower = false) {
            const head = snake[0];
            let possibleMoves = [
                {x: 0, y: -1}, {x: 0, y: 1}, {x: -1, y: 0}, {x: 1, y: 0}
            ];

            possibleMoves.sort((a, b) => {
                let distA = Math.abs((goat.x + a.x) - head.x) + Math.abs((goat.y + a.y) - head.y);
                let distB = Math.abs((goat.x + b.x) - head.x) + Math.abs((goat.y + b.y) - head.y);
                return distB - distA;
            });

            let validMoves = possibleMoves.filter(m => {
                let nx = goat.x + m.x;
                let ny = goat.y + m.y;
                return !isCellBlocked(nx, ny, goat);
            });

            if (validMoves.length > 0) {
                goat.x += validMoves[0].x;
                goat.y += validMoves[0].y;
            }
        }

        function moveGoatTowards(goat) {
            const head = snake[0];
            let possibleMoves = [
                {x: 0, y: -1}, {x: 0, y: 1}, {x: -1, y: 0}, {x: 1, y: 0}
            ];

            possibleMoves.sort((a, b) => {
                let distA = Math.abs((goat.x + a.x) - head.x) + Math.abs((goat.y + a.y) - head.y);
                let distB = Math.abs((goat.x + b.x) - head.x) + Math.abs((goat.y + b.y) - head.y);
                return distA - distB;
            });

            let validMoves = possibleMoves.filter(m => {
                let nx = goat.x + m.x;
                let ny = goat.y + m.y;
                return !isCellBlocked(nx, ny, goat);
            });

            if (validMoves.length > 0) {
                goat.x += validMoves[0].x;
                goat.y += validMoves[0].y;
            }
        }

        function clearCanvas() {
            ctx.fillStyle = "#f8fafc";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawGrid() {
            ctx.strokeStyle = "#e2e8f0";
            ctx.lineWidth = 0.5;
            for (let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * tileSize, 0);
                ctx.lineTo(i * tileSize, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * tileSize);
                ctx.lineTo(canvas.width, i * tileSize);
                ctx.stroke();
            }
        }

        function moveSnake() {
            const nextX = snake[0].x + dx;
            const nextY = snake[0].y + dy;
            
            let targetX = nextX;
            let targetY = nextY;
            if (targetX < 0) targetX = tileCount - 1;
            if (targetX >= tileCount) targetX = 0;
            if (targetY < 0) targetY = tileCount - 1;
            if (targetY >= tileCount) targetY = 0;

            const head = { x: targetX, y: targetY };
            
            let eatenIndex = -1;
            goats.forEach((goat, index) => {
                if (!goat.collected && head.x === goat.x && head.y === goat.y) {
                    if (goat.isZakri) {
                        if (zakriPhase === 2) {
                            eatenIndex = index;
                        }
                    } else {
                        eatenIndex = index;
                    }
                }
            });

            snake.unshift(head);

            if (eatenIndex !== -1) {
                playEatSound();
                triggerVibration([80, 50, 80]);
                const goat = goats[eatenIndex];
                goat.collected = true;
                if (!collectedNames.includes(goat.name)) {
                    collectedNames.push(goat.name);
                }
                updateUI();
                
                if (collectedNames.length === allNames.length) {
                    triggerWin();
                }
            } else {
                snake.pop();
            }
        }

        function triggerWin() {
            isGameRunning = false;
            if (gameInterval) clearInterval(gameInterval);
            document.getElementById("winOverlay").classList.remove("hidden");
            spawnFireworks();
        }

        function spawnFireworks() {
            const container = document.getElementById("fireworksContainer");
            container.innerHTML = "";
            for (let i = 0; i < 15; i++) {
                const p = document.createElement("div");
                p.className = "firework-particle absolute w-3 h-3 rounded-full";
                p.style.backgroundColor = ['#f43f5e', '#a855f7', '#06b6d4', '#eab308', '#22c55e'][Math.floor(Math.random() * 5)];
                p.style.left = Math.random() * 100 + "%";
                p.style.top = Math.random() * 100 + "%";
                container.appendChild(p);
            }
        }

        function drawCharacter(x, y, name, isZakri, collected) {
            if (collected) return;

            const px = x * tileSize;
            const py = y * tileSize;
            const cx = px + tileSize / 2;
            const cy = py + tileSize / 2;

            ctx.save();

            if (isZakri) {
                let zakriColor = "#111827";
                let glowColor = "rgba(0,0,0,0.4)";

                const head = snake[0];
                const dist = Math.abs(head.x - x) + Math.abs(head.y - y);

                if (zakriPhase === 2) {
                    zakriColor = "#22c55e";
                    glowColor = "rgba(34,197,94,0.8)";
                } else if (zakriPhase === 1) {
                    zakriColor = "#ef4444";
                    glowColor = "rgba(239,68,68,0.8)";
                } else if (dist <= 3) {
                    zakriColor = "#ffffff";
                    glowColor = "rgba(255,255,255,0.8)";
                }

                ctx.shadowBlur = 8;
                ctx.shadowColor = glowColor;
                ctx.fillStyle = zakriColor;
                ctx.beginPath();
                ctx.arc(cx, cy + 2, 8, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = zakriColor === "#ffffff" ? "#ec4899" : zakriColor;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(cx - 3, cy - 4);
                ctx.quadraticCurveTo(cx - 10, cy - 10, cx - 6, cy - 12);
                ctx.moveTo(cx + 3, cy - 4);
                ctx.quadraticCurveTo(cx + 10, cy - 10, cx + 6, cy - 12);
                ctx.stroke();

                ctx.fillStyle = zakriColor === "#ffffff" ? "#0284c7" : "#eab308";
                ctx.beginPath();
                ctx.arc(cx - 3, cy, 1.5, 0, Math.PI * 2);
                ctx.arc(cx + 3, cy, 1.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();

                ctx.fillStyle = zakriColor === "#ef4444" ? "#dc2626" : "#0284c7";
                ctx.font = "bold 11px 'Orbitron', sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(name, cx, py + tileSize + 12);
                return;
            }

            ctx.shadowBlur = 4;
            ctx.shadowColor = "rgba(0,0,0,0.5)";
            ctx.fillStyle = "#111827";
            
            ctx.beginPath();
            ctx.arc(cx, cy + 2, 8, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(cx - 6, cy - 3);
            ctx.lineTo(cx - 11, cy - 10);
            ctx.lineTo(cx - 3, cy - 5);
            ctx.moveTo(cx + 6, cy - 3);
            ctx.lineTo(cx + 11, cy - 10);
            ctx.lineTo(cx + 3, cy - 5);
            ctx.fill();

            ctx.fillStyle = "#eab308";
            ctx.beginPath();
            ctx.arc(cx - 3, cy, 1.5, 0, Math.PI * 2);
            ctx.arc(cx + 3, cy, 1.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            ctx.fillStyle = "#0284c7";
            ctx.font = "bold 11px 'Orbitron', sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(name, cx, py + tileSize + 12);
        }

        function drawGoats() {
            goats.forEach(goat => {
                drawCharacter(goat.x, goat.y, goat.name, goat.isZakri, goat.collected);
            });
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.shadowBlur = index === 0 ? 8 : 2;
                ctx.shadowColor = '#0284c7';
                ctx.fillStyle = index === 0 ? '#0284c7' : '#9333ea';

                ctx.beginPath();
                ctx.roundRect(
                    part.x * tileSize + 1, 
                    part.y * tileSize + 1, 
                    tileSize - 2, 
                    tileSize - 2, 
                    4
                );
                ctx.fill();
            });
            ctx.shadowBlur = 0;
        }

        function updateUI() {
            const count = collectedNames.length;
            document.getElementById("progressText").innerText = `${count} / ${allNames.length}`;

            allNames.forEach((name, index) => {
                const slot = document.getElementById(`slot-${index}`);
                if (collectedNames.includes(name)) {
                    slot.className = "bg-purple-600 border border-cyan-400 rounded p-0.5 text-center text-[8px] text-white font-bold shadow-sm transition-all truncate";
                } else {
                    slot.className = "bg-purple-50 border border-purple-200 rounded p-0.5 text-center text-[8px] text-gray-500 font-semibold transition-all shadow-sm truncate";
                }
            });
        }

        document.addEventListener("keydown", e => {
            initAudio();
            if (!isGameRunning) {
                startGame();
                return;
            }

            const keyPressed = e.key;
            if (changingDirection) return;

            if ((keyPressed === "ArrowUp" || keyPressed === "w" || keyPressed === "ц") && dy === 0) {
                dx = 0; dy = -1; changingDirection = true;
                flashButtonEffect('btn-up');
            }
            if ((keyPressed === "ArrowDown" || keyPressed === "s" || keyPressed === "ы") && dy === 0) {
                dx = 0; dy = 1; changingDirection = true;
                flashButtonEffect('btn-down');
            }
            if ((keyPressed === "ArrowLeft" || keyPressed === "a" || keyPressed === "ф") && dx === 0) {
                dx = -1; dy = 0; changingDirection = true;
                flashButtonEffect('btn-left');
            }
            if ((keyPressed === "ArrowRight" || keyPressed === "d" || keyPressed === "в") && dx === 0) {
                dx = 1; dy = 0; changingDirection = true;
                flashButtonEffect('btn-right');
            }
        });

        function flashButtonEffect(btnId) {
            triggerVibration(40);
            const btn = document.getElementById(btnId);
            if (btn) {
                btn.classList.add("control-btn-active");
                setTimeout(() => {
                    btn.classList.remove("control-btn-active");
                }, 150);
            }
        }

        function changeDirectionDirect(dir, btnId) {
            initAudio();
            if (!isGameRunning) return;
            if (changingDirection) return;

            flashButtonEffect(btnId);

            if (dir === 'UP' && dy === 0) { dx = 0; dy = -1; changingDirection = true; }
            if (dir === 'DOWN' && dy === 0) { dx = 0; dy = 1; changingDirection = true; }
            if (dir === 'LEFT' && dx === 0) { dx = -1; dy = 0; changingDirection = true; }
            if (dir === 'RIGHT' && dx === 0) { dx = 1; dy = 0; changingDirection = true; }
        }

        const btnLeft = document.getElementById("btn-left");
        const btnRight = document.getElementById("btn-right");
        const btnUp = document.getElementById("btn-up");
        const btnDown = document.getElementById("btn-down");

        btnUp.addEventListener("touchstart", (e) => { e.preventDefault(); changeDirectionDirect('UP', 'btn-up'); });
        btnUp.addEventListener("mousedown", () => changeDirectionDirect('UP', 'btn-up'));

        btnDown.addEventListener("touchstart", (e) => { e.preventDefault(); changeDirectionDirect('DOWN', 'btn-down'); });
        btnDown.addEventListener("mousedown", () => changeDirectionDirect('DOWN', 'btn-down'));

        btnLeft.addEventListener("touchstart", (e) => { e.preventDefault(); changeDirectionDirect('LEFT', 'btn-left'); });
        btnLeft.addEventListener("mousedown", () => changeDirectionDirect('LEFT', 'btn-left'));

        btnRight.addEventListener("touchstart", (e) => { e.preventDefault(); changeDirectionDirect('RIGHT', 'btn-right'); });
        btnRight.addEventListener("mousedown", () => changeDirectionDirect('RIGHT', 'btn-right'));

        let touchStartX = 0;
        let touchStartY = 0;

        window.addEventListener('touchstart', e => {
            initAudio();
            if (currentControlType !== "swipe") return;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, false);

        window.addEventListener('touchend', e => {
            if (currentControlType !== "swipe") return;
            if (!isGameRunning) return;

            let touchEndX = e.changedTouches[0].clientX;
            let touchEndY = e.changedTouches[0].clientY;

            let diffX = touchEndX - touchStartX;
            let diffY = touchEndY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 30 && dx === 0) { dx = 1; dy = 0; triggerVibration(30); }
                else if (diffX < -30 && dx === 0) { dx = -1; dy = 0; triggerVibration(30); }
            } else {
                if (diffY > 30 && dy === 0) { dx = 0; dy = 1; triggerVibration(30); }
                else if (diffY < -30 && dy === 0) { dx = 0; dy = -1; triggerVibration(30); }
            }
        }, false);

        clearCanvas();
        drawGrid();
    </script>
</body>
</html>
